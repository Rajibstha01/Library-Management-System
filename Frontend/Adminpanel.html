<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Booked's</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="Background">

            <!-- left decorative panel -->
            <div class="login-left">
                <div class="login-left-inner">
                    <img src="https://cdn-icons-png.flaticon.com/512/16419/16419837.png" alt="Booked's logo" class="login-logo">
                    <h2 class="login-brand">Booked's</h2>
                    <p class="login-tagline">Your library, <br>beautifully managed.</p>
                    <div class="login-decoration">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>

            <!-- right form panel -->
            <div class="login-right">
                <div class="textadmin">
                    <h1 class="login-title">Welcome back</h1>
                    <p class="login-subtitle">Sign in to your admin panel</p>

                    <div class="input-group">
                        <label for="Username">Username</label>
                        <div class="input-wrap">
                            <input type="text" placeholder="Enter your username" id="Username">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="Password">Password</label>
                        <div class="input-wrap">
                            <input type="password" placeholder="Enter your password" id="Password">
                        </div>
                    </div>

                    <button class="login-btn">Login</button>

                    <a href="home.html" class="back-link">← Back to reader portal</a>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
