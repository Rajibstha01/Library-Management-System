<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Booked's</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="Background">

            <!-- left decorative panel -->
            <div class="login-left">
                <div class="login-left-inner">
                    <img src="https://cdn-icons-png.flaticon.com/512/16419/16419837.png" alt="Booked's logo" class="login-logo">
                    <h2 class="login-brand">Booked's</h2>
                    <p class="login-tagline">Your library, <br>beautifully managed.</p>
                    <div class="login-decoration">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>

            <!-- right form panel -->
            <div class="login-right">
                <div class="textadmin">

                    <!-- tab toggle -->
                    <div class="auth-tabs">
                        <button type="button" class="auth-tab active" id="tabLogin">Login</button>
                        <button type="button" class="auth-tab" id="tabRegister">Register</button>
                    </div>

                    <!-- message box for errors / success -->
                    <div id="authMessage" class="auth-message" style="display:none;"></div>

                    <!-- LOGIN FORM -->
                    <form id="loginForm">
                        <h1 class="login-title">Welcome back</h1>
                        <p class="login-subtitle">Sign in to your account</p>

                        <div class="input-group">
                            <label for="loginEmail">Email</label>
                            <div class="input-wrap">
                                <input type="email" placeholder="Enter your email" id="loginEmail" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="loginPassword">Password</label>
                            <div class="input-wrap">
                                <input type="password" placeholder="Enter your password" id="loginPassword" required>
                            </div>
                        </div>

                        <button type="submit" class="login-btn" id="loginBtn">Login</button>
                    </form>

                    <!-- REGISTER FORM -->
                    <form id="registerForm" style="display:none;">
                        <h1 class="login-title">Create account</h1>
                        <p class="login-subtitle">Join Booked's to get started</p>

                        <div class="input-group">
                            <label for="registerName">Name</label>
                            <div class="input-wrap">
                                <input type="text" placeholder="Enter your name" id="registerName" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="registerEmail">Email</label>
                            <div class="input-wrap">
                                <input type="email" placeholder="Enter your email" id="registerEmail" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="registerPassword">Password</label>
                            <div class="input-wrap">
                                <input type="password" placeholder="8–16 characters" id="registerPassword" minlength="8" maxlength="16" required>
                            </div>
                        </div>

                        <button type="submit" class="login-btn" id="registerBtn">Register</button>
                    </form>

                    <a href="home.html" class="back-link">← Back to reader portal</a>
                </div>
            </div>

        </div>
    </main>
    <script src="config-page.js"></script>
    <script src="auth-page.js"></script>
</body>
</html>
