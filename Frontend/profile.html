<!DOCTYPE html>

<head>

    <title>My Profile — Booked's</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div id="home">
                <a href="index.html">
                    <img src="https://cdn-icons-png.flaticon.com/512/16419/16419837.png" alt="">Booked's
                </a>
            </div>
            <div>
                <input type="text" name="" id="searchbar" placeholder="Search">
                <a href="index.html">Home</a>
                <a href="browsebook.html">Browse Book</a>

                <button id="navbutton"> Admin </button></a>
            </div>
        </nav>
    </header>

    <main>
        <div class="profile-wrap">
            <div class="profile-card">
                <img id="profileAvatar" class="profile-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Avatar">
                <h1 id="profileName" class="profile-name">—</h1>
                <span id="profileRoleBadge" class="profile-role-badge">—</span>

                <div class="profile-details">
                    <div class="profile-row">
                        <span class="profile-label">Email</span>
                        <span id="profileEmail" class="profile-value">—</span>
                    </div>
                    <div class="profile-row">
                        <span class="profile-label">Member since</span>
                        <span id="profileJoined" class="profile-value">—</span>
                    </div>
                </div>

                <a href="Addbook.html" id="adminLink" class="login-btn" style="display:none; text-decoration:none; text-align:center; margin-top: 1.5rem;">Go to Admin Panel</a>

                <button id="logoutBtn" class="logout-btn">Log out</button>
            </div>
        </div>
    </main>

    <footer>
        <div id="Discover">
            <h1>Discover</h1>
            <br>
